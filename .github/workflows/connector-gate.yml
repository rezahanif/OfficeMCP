# Calls the shared AiConnect pre-release gate. Do NOT copy checks into this file:
# seven divergent CI workflows is the same failure mode as seven divergent packagers.
# The gate itself lives in rezahanif/AiConnect/.github/workflows/ci-connectors.yml.
#
# Requires an AICONNECTOR_TOKEN repo secret with read access to rezahanif/AiConnect.
name: Connector gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    uses: rezahanif/AiConnect/.github/workflows/ci-connectors.yml@main
    secrets:
      aiconnector-token: ${{ secrets.AICONNECTOR_TOKEN }}
